<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웰빙내과 수액실</title>
<style>
/* 11-17 부원장님: 수액 프로그램 — 웰빙 그린 + 딥네이비 글자, 등급색은 홍보영상 가격카드와 같게 */
:root{
  --green:#195C3B; --teal:#3B8C7A; --mint:#D7ECE8; --ink:#16233F; --sub:#5E6F66; --amber:#D9822B;
  --bg:#F6F0E4; --card:#FFFDF8; --line:#E4DCCB; --red:#C0392B; --redbg:#FBE3E0; --yel:#FFF3CF;
  --t-basic:#D3DCF1; --t-plus:#CDEFF5; --t-premium:#F8D3E7;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:18px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;
  gap:18px;padding:10px 22px;flex-wrap:wrap}
header .logo{font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
header .logo b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fff;color:var(--green)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;opacity:.8;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700}
nav button.on{background:rgba(255,255,255,.18);opacity:1}
main{max-width:1280px;margin:0 auto;padding:22px}
h1{font-size:28px;margin:0 0 14px;letter-spacing:-.5px}
h2{font-size:22px;margin:0 0 10px;letter-spacing:-.3px}
h3{font-size:19px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--sub)}
.small{font-size:15px}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;cursor:pointer;font-weight:600;user-select:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.red.on{background:var(--red);border-color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-weight:700;font-size:15px}
.tier-basic{background:var(--t-basic)} .tier-plus{background:var(--t-plus)} .tier-premium{background:var(--t-premium)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;min-width:0}
input[type=number]{width:110px}
.vital input{width:120px;font-size:24px;font-weight:700;text-align:center}
.vital label{display:block;font-size:15px;color:var(--sub);margin-bottom:4px}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:15px;color:var(--sub);font-weight:700}
.prog{border-radius:18px;padding:16px;cursor:pointer;border:2px solid transparent;background:#fff;transition:.1s}
.prog:hover{transform:translateY(-2px)}
.prog.on{border-color:var(--ink)}
.prog .ic{font-size:30px}
.prog .nm{font-weight:800;font-size:21px}
.tierbox{border-radius:16px;padding:14px 16px;cursor:pointer;border:2px solid transparent}
.tierbox.on{border-color:var(--ink)}
.tierbox .price{font-size:24px;font-weight:800}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--teal);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--teal)}
.dot.done{background:var(--teal);color:#fff}
.bag{border:1.5px dashed var(--teal);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.bag .base{font-weight:800;font-size:20px}
.item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:20px}
.item input[type=checkbox]{width:24px;height:24px}
.item.removed{color:#9aa;text-decoration:line-through}
.item .why{font-size:14px;text-decoration:none;color:var(--red);display:inline-block}
.alert{border-radius:12px;padding:10px 14px;margin:6px 0;font-weight:600}
.alert.stop{background:var(--redbg);color:var(--red)}
.alert.warn{background:var(--yel)}
.alert.info{background:var(--mint)}
.kpi{background:var(--mint);border-radius:16px;padding:14px 18px;text-align:center}
.kpi .v{font-size:40px;font-weight:800;line-height:1.1}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:hover{background:#fff}
.tag{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--mint);font-weight:700}
.tag.late{background:var(--redbg);color:var(--red)}
.emr{white-space:pre;font-family:ui-monospace,Consolas,monospace;font-size:15px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:12px;overflow:auto}
.steps{counter-reset:s}
.step h2::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:32px;height:32px;
  border-radius:50%;background:var(--green);color:#fff;margin-right:10px;font-size:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;
  border-radius:14px;font-weight:700;z-index:50;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--sub);padding:20px;text-align:center}
.swatch{width:12px;height:12px;border-radius:4px;display:inline-block}
.matrix td{font-size:15px}
.matrix .pn{font-weight:800;font-size:18px}
/* 11-17 부원장님: 같이 섞으면 안 되는 조합은 옆 칸으로 따로 */
.withside{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}
.side .rule{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.side .rule.hit{border-color:var(--red);background:var(--redbg)}
.side .rule .t{font-weight:800}
.side .rule .lv{font-size:12px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px}
.lv.bag{background:var(--red);color:#fff} .lv.care{background:var(--yel)}
.bagno{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--teal);color:#fff;font-weight:800;margin-right:6px}
@media (max-width:1100px){.withside{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media print{
  .side{position:static;max-height:none}
  header,nav,.noprint{display:none!important}
  body{background:#fff;font-size:13px}
  main{padding:0;max-width:none}
  .card{border:0;padding:6px 0;break-inside:avoid}
  .matrix td{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="logo"><b>W</b>웰빙내과 수액실</div>
  <nav id="nav">
    <button data-go="board">오늘</button>
    <button data-go="patients">환자</button>
    <button data-go="table">프로그램표</button>
    <button data-go="settings">설정</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ───────── 공통 ───────── */
const S = {cat:null, view:"board", pid:null, cid:null, draft:null, run:null};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (n == null || n === "") ? "—" : Number(n).toLocaleString("ko-KR") + "원";
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const hm = () => new Date().toTimeString().slice(0,5);
const md = s => s ? (+s.slice(5,7)) + "/" + (+s.slice(8,10)) : "";
const DOW = ["일","월","화","수","목","금","토"];
const mdw = s => s ? md(s) + "(" + DOW[new Date(s + "T00:00").getDay()] + ")" : "";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
async function api(method, url, body){
  const r = await fetch(url, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ toast(j.error || "오류"); throw new Error(j.error || r.status); }
  return j;
}
const P = k => S.cat.programs[k];
const TL = p => S.cat.tiers.filter(t => p.tiers[t]);   // 프로그램마다 등급 수가 다름 (기본·프리미엄, 장염은 플러스까지)
const TN = t => S.cat.tier_name[t];
const SUP = k => S.cat.supplements[k] || {name:k};
function go(view, opt={}){ Object.assign(S, opt); S.view = view; render(); window.scrollTo(0,0); }
document.getElementById("nav").addEventListener("click", e => { const b=e.target.closest("button"); if(b) go(b.dataset.go); });

function recipeLines(bags){
  return bags.map((b,i) => (S.cat.ingredients[b.base].shot ? "💉 " : (bags.length>1 ? `<b style="color:var(--teal)">${i+1}백</b> ` : "")) + esc(S.cat.ingredients[b.base].name) +
    (S.cat.ingredients[b.base].stock===false ? '<span class="tag late">재고 확인</span>' : "") +
    (b.add.length ? " + " + b.add.map(([k,q]) => esc(S.cat.ingredients[k].name) + " " + q + esc(S.cat.ingredients[k].unit)).join(" + ") : "")).join("<br>");
}

/* ───────── 같이 섞으면 안 되는 조합 (옆 칸) ───────── */
function sidePanel(hitIds){
  const rules = S.cat.incompat || [], hit = new Set(hitIds||[]);
  const sorted = [...rules].sort((a,b) => (hit.has(b.id)-hit.has(a.id)) || ((b.level==="bag")-(a.level==="bag")));
  return `<div class="card side"><h2>🚫 같이 섞으면 안 되는 조합</h2>
    <p class="small muted" style="margin:0 0 8px">빨간 칸 = 오늘 수액에 들어 있는 조합 → 꼭 다른 백으로</p>
    ${sorted.map(r => `<div class="rule ${hit.has(r.id)?'hit':''}">
      <div><span class="t">${esc(r.title)}</span><span class="lv ${r.level}">${r.level==="bag"?"같은 백 금지":"주의"}</span></div>
      <div class="small">${esc(r.why)}</div>
      <div class="small"><b>→ ${esc(r.do)}</b></div>
      ${r.src?`<div class="small muted">${esc(r.src)}</div>`:""}</div>`).join("") || `<div class="muted">규칙 없음</div>`}
    <h3 style="margin-top:12px">한 백에 하나만</h3>
    <div class="small">${Object.values(S.cat.ingredients).filter(i=>i.carriers).map(i=>`<b>${esc(i.name)}</b>: 바탕액 ${i.carriers.map(c=>esc((S.cat.ingredients[c]||{}).name||c)).join("·")}`).join("<br>")||"—"}</div>
  </div>`;
}

/* ───────── 오늘 ───────── */
async function viewBoard(el){
  const b = await api("GET", "/api/board?days=7");
  const sec = (title, rows, fn, emptyMsg) => `<div class="card"><h2>${title} <span class="muted small">${rows.length}명</span></h2>
    ${rows.length ? rows.map(fn).join("") : `<div class="empty">${emptyMsg}</div>`}</div>`;
  const who = r => `<b>${esc(r.name)}</b> <span class="muted small">${esc(r.chart_no)}</span>`;
  el.innerHTML = `<div class="row"><h1>오늘 · ${mdw(b.on)}</h1><span class="sp"></span>
     <button class="btn" onclick="go('patients')">＋ 환자 찾기·등록</button></div>
   <div class="grid g3">
    ${sec("💧 수액 회차", b.due, r => `<div class="list-item" onclick="openPatient(${r.patient_id})">
        <span class="swatch" style="background:${P(r.program).color}"></span>
        <div class="sp">${who(r)}<br><span class="small">${esc(r.program_name)} · <span class="pill tier-${r.tier}">${TN(r.tier)}</span> · ${r.done+1}/${r.total}회</span></div>
        <span class="tag ${r.late?'late':''}">${r.d<=b.on? (r.late?'지남 ':'')+mdw(r.d) : mdw(r.d)}</span></div>`, "이번 주 예정 회차 없음")}
    ${sec("🛒 보충제 다 떨어질 때", b.refill, r => `<div class="list-item" onclick="openPatient(${r.patient_id})">
        <div class="sp">${who(r)}<br><span class="small">${esc(r.sup_name)}</span></div>
        <span class="tag ${r.late?'late':''}">${mdw(r.d)}</span></div>`, "이번 주 재구매 대상 없음")}
    ${sec("📈 증상 점수 다시 재기", b.followup, r => `<div class="list-item" onclick="openPatient(${r.patient_id})">
        <div class="sp">${who(r)}<br><span class="small">${esc(r.program_name)} · ${r.week}주차</span></div>
        <span class="tag">${mdw(r.d)}</span></div>`, "이번 주 없음")}
   </div>`;
}

/* ───────── 환자 ───────── */
async function viewPatients(el){
  el.innerHTML = `<h1>환자</h1>
   <div class="card"><div class="row"><input type="text" id="q" placeholder="차트번호·이름" style="flex:1;font-size:20px">
     <button class="btn" id="qb">찾기</button></div><div id="plist"></div></div>
   <div class="card"><h2>새 환자</h2><div class="row">
     <input type="text" id="n_chart" placeholder="차트번호" style="width:140px">
     <input type="text" id="n_name" placeholder="이름" style="width:140px">
     <input type="date" id="n_birth" title="생년월일">
     <span class="chip" data-sex="M">남</span><span class="chip" data-sex="F">여</span>
     <button class="btn" id="n_add">등록</button></div>
     <p class="muted small">실제 운영 전에는 시험용 가짜 환자만 넣어 주세요.</p></div>`;
  let sex = "";
  el.querySelectorAll("[data-sex]").forEach(c => c.onclick = () => { sex=c.dataset.sex; el.querySelectorAll("[data-sex]").forEach(x=>x.classList.toggle("on", x===c)); });
  const load = async () => {
    const rows = await api("GET", "/api/patients?q=" + encodeURIComponent($("#q").value.trim()));
    $("#plist").innerHTML = rows.length ? rows.map(p => `<div class="list-item" onclick="openPatient(${p.id})">
      <b>${esc(p.name)}</b><span class="muted">${esc(p.chart_no)}</span><span class="muted small">${esc(p.birth||"")} ${p.sex==="M"?"남":p.sex==="F"?"여":""}</span></div>`).join("")
      : `<div class="empty">없음</div>`;
  };
  $("#qb").onclick = load; $("#q").onkeydown = e => { if(e.key==="Enter") load(); };
  $("#n_add").onclick = async () => {
    const r = await api("POST", "/api/patients", {chart_no:$("#n_chart").value, name:$("#n_name").value, birth:$("#n_birth").value, sex});
    toast(r.existing ? "이미 있는 차트번호 — 그 환자로 엽니다" : "등록했습니다"); openPatient(r.id);
  };
  load();
}
function openPatient(id){ go("patient", {pid:id}); }

async function viewPatient(el){
  const p = await api("GET", "/api/patients/" + S.pid);
  S.patient = p;
  const active = p.courses.filter(c => c.status==="수액중" || c.status==="경구유지");
  const past = p.courses.filter(c => !(c.status==="수액중" || c.status==="경구유지"));
  el.innerHTML = `<div class="row"><h1>${esc(p.name)} <span class="muted" style="font-size:20px">${esc(p.chart_no)} · ${esc(p.birth||"")} ${p.sex==="M"?"남":p.sex==="F"?"여":""}</span></h1>
     <span class="sp"></span><button class="btn" onclick="newCourse()">＋ 새 프로그램</button></div>
   ${active.length ? active.map(courseCard).join("") : `<div class="card empty">진행 중인 프로그램 없음 — 「새 프로그램」으로 시작하세요</div>`}
   ${past.length ? `<h2 style="margin-top:24px">지난 프로그램</h2>` + past.map(courseCard).join("") : ""}`;
  p.courses.forEach(c => { const el2 = document.getElementById("chart"+c.id); if(el2) drawScores(el2, c); });
}

function courseCard(c){
  const pr = P(c.program);
  const dots = Array.from({length:c.total}, (_,i) => `<span class="dot ${i<c.done?'done':''}" title="${c.sessions[i]? c.sessions[i].d : (c.plan_dates[i]||'')}">${i+1}</span>`).join("");
  const plan = c.oral_plan || {with:[], after:[]};
  const lastBy = {}; c.refills.forEach(r => lastBy[r.sup] = r);
  const supRow = (r, phase) => { const rf = lastBy[r.sup];
    return `<tr><td><b>${esc(r.name)}</b><br><span class="small muted">${esc(r.dose)} · ${r.weeks}주 · ${esc(r.why)}</span></td>
     <td class="small">${phase}</td>
     <td class="small">${rf ? "지급 "+md(rf.last)+"<br>다음 "+mdw(rf.due) : "—"}</td>
     <td class="noprint"><button class="btn sm ghost" onclick="giveOral(${c.id},'${r.sup}')">지급</button></td></tr>`; };
  const stColor = {"수액중":"var(--teal)","경구유지":"var(--amber)","종료":"#889","중단":"var(--red)"}[c.status] || "#889";
  const sc = pr.score;
  const lastScore = c.scores.length ? c.scores[c.scores.length-1] : null;
  return `<div class="card" style="border-left:8px solid ${pr.color}">
   <div class="row"><span style="font-size:28px">${pr.icon}</span>
     <h2 style="margin:0">${esc(pr.name)}</h2><span class="pill tier-${c.tier}">${TN(c.tier)}</span>
     <span class="pill" style="background:${stColor};color:#fff">${c.status}</span>
     ${c.subtype ? `<span class="pill" style="background:var(--mint)">${esc(pr.subtypes[c.subtype].label)}</span>` : ""}
     <span class="sp"></span>
     ${c.status==="수액중" ? `<button class="btn" onclick="startRun(${c.id})">💧 오늘 ${c.done+1}회차 진행</button>` : ""}
     <select class="noprint" onchange="setStatus(${c.id}, this.value)">
       ${["수액중","경구유지","종료","중단"].map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select>
   </div>
   <div class="grid g3" style="margin-top:12px">
    <div><div class="muted small">수액 ${c.done}/${c.total}회 · 시작 ${mdw(c.start_date)}</div><div class="dots" style="margin:6px 0">${dots}</div>
      ${c.next_due ? `<div>다음 권장 <b>${mdw(c.next_due)}</b></div>` : `<div class="muted">수액 회차 끝</div>`}
      <div class="small muted">값 ${won(c.price)}${c.total>1 ? ` (1회 ${won(c.price_each)})` : ""}</div></div>
    <div><div class="muted small">${esc(sc.label)}</div>
      <div class="row"><span class="big">${lastScore ? lastScore.value : "—"}</span>${lastScore&&lastScore.detail&&lastScore.detail.grade?`<span class="tag">${esc(lastScore.detail.grade)}</span>`:""}
      <span class="sp"></span><button class="btn sm ghost noprint" onclick="scoreDlg(${c.id})">점수 넣기</button></div>
      <div id="chart${c.id}"></div></div>
    <div><div class="muted small">처방약·메모</div><div>${esc(c.meds||"—")}</div><div class="small muted">${esc(c.note||"")}</div>
      <button class="btn sm ghost noprint" style="margin-top:6px" onclick="printHandout(${c.id})">🖨 환자 안내문</button></div>
   </div>

function drawScores(el, c){
  const pts = c.scores; if(pts.length < 1){ el.innerHTML = ""; return; }
  const max = P(c.program).score.max, W = 300, H = 90, pad = 14;
  const x = i => pad + (pts.length===1 ? (W-2*pad)/2 : i*(W-2*pad)/(pts.length-1));
  const y = v => H - pad - (v/max)*(H-2*pad);
  const path = pts.map((p,i)=>(i?"L":"M")+x(i)+","+y(p.value)).join(" ");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">
    <path d="${path}" fill="none" stroke="var(--amber)" stroke-width="3"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="5" fill="var(--amber)"><title>${p.d} ${p.value}</title></circle>
      <text x="${x(i)}" y="${H-1}" font-size="11" text-anchor="middle" fill="#5E6F66">${md(p.d)}</text>`).join("")}</svg>`;
}

function pick(k, v){ S.draft[k] = v; if(k==="program"){ S.draft.tier="basic"; S.draft.option=0; S.draft.subtype=null; S.draft.focus=[]; S.draft.meds=[]; } S.draft.price=null; render(); }
function toggleArr(k, v){ const a=S.draft[k]; const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); render(); }
function guessSub(){ const h=+$("#hp").value||0, l=+$("#lp").value||0;
  const st = (h>25&&l>25)?"M":(h>25&&l<25)?"C":(l>25&&h<25)?"D":"U"; pick("subtype", st); toast("유형: "+P("gut").subtypes[st].label); }
function planDates(start, total, perWeek){
  if(total<=1||perWeek<=0) return [start];
  const gaps = perWeek>=2?[3,4]:[7]; const out=[start]; let d=new Date(start+"T00:00");
  for(let i=0;i<total-1;i++){ d.setDate(d.getDate()+gaps[i%gaps.length]); const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function pkgPrice(p, n, disc){ if(!p||n<=1) return p; return Math.round(p*n*(100-disc)/100/1000)*1000; }
function oralPlan(prog, sub, focus){
  const pr = P(prog), o = pr.oral||{};
  let w = [...(o.with||[])], a = [...(o.after||[])];
  if(prog==="gut" && sub){ w = w.concat(pr.subtypes[sub].with||[]); a = a.concat(pr.subtypes[sub].after||[]); }
  if(prog==="gut") (focus||[]).forEach(f => a = a.concat(pr.focus[f].after||[]));
  const u = l => { const s=new Set(); return l.filter(r => s.has(r.sup)?false:(s.add(r.sup),true)).map(r => ({...r, name:SUP(r.sup).name, dose:r.dose||SUP(r.sup).dose})); };
  return {with:u(w), after:u(a)};
}

    (r.mix_notes||[]).map(x=>`<div class="alert warn">🧪 ${x.bag}번 백: ${esc(x.title)} → ${esc(x.do)}</div>`).join("") +
    r.bags.map(b => `<div class="bag" style="${b.shot?'border-style:solid;border-color:var(--amber)':''}${b.removed?';opacity:.5':''}"><div class="row"><span class="base">${b.shot?'💉 ':(r.bags.length>1? `<span class="bagno">${b.order}</span>`:"")}${esc(b.base_name)}</span>
        ${b.base_note?`<span class="tag">${esc(b.base_note)}</span>`:""}${b.removed?'<span class="tag late">이 백 빠짐</span>':""}<span class="sp"></span>
        ${b.shot ? `<span class="small muted">수액과 따로, 같은 날</span>` : `<span class="small"><b>${b.minutes}분↑</b>${r.bags.length>1 && b.order>1 ? ' · 앞 백 끝난 뒤 식염수 흘리고 연결':''}</span>`}</div>
      ${b.items.map(it => { const id = b.order+"_"+it.key; const info = ing[it.key];
        return `<div class="item ${it.removed?'removed':''}">${it.removed?'<span style="width:24px">✕</span>':`<input type="checkbox" data-mix="${id}" ${R.mixed[id]?"checked":""}>`}
          <b>${esc(it.name)}</b> <span>${it.qty}${esc(it.unit)}</span>
          <span class="small muted">${esc(info.generic||"")}${info.mix? " · "+esc(info.mix):""}</span>
          ${it.removed?`<span class="why">${esc(it.reason)}</span>`:""}</div>`; }).join("") || `<div class="muted">섞는 약 없음</div>`}</div>`).join("") +
    (r.notices.length ? `<h3 style="margin-top:12px">환자에게 미리 말하기</h3>` + r.notices.map(n=>`<div class="alert info">💬 ${esc(n)}</div>`).join("") : "");
  const dok = $("#dok"); if(dok) dok.onchange = () => R.doctor_ok = dok.checked;
  document.querySelectorAll("[data-mix]").forEach(x => x.onchange = () => R.mixed[x.dataset.mix] = x.checked);
  $("#infuse").innerHTML = `<div class="grid g3">
     <div class="kpi"><div class="small">총량</div><div class="v">${r.volume_ml}<span style="font-size:18px">mL</span></div></div>
     <div class="kpi"><div class="small">시간</div><div class="v" style="display:flex;justify-content:center;align-items:baseline"><input type="number" id="mins" value="${R.minutes}" style="width:90px;font-size:34px;font-weight:800;text-align:right;border:0;background:transparent;padding:0"><span style="font-size:18px">분</span></div></div>
     <div class="kpi" style="background:var(--t-plus)"><div class="small">분당 방울 (${R.gtt}gtt 세트)</div><div class="v">${r.drip.gtt_per_min}</div><div class="small">${r.drip.ml_per_hr} mL/시 · ${r.drip.sec_per_drop}초에 1방울</div></div></div>
    <div class="row" style="margin-top:12px"><span class="muted">수액 세트</span>
      ${[15,20,60].map(g=>`<span class="chip ${R.gtt===g?'on':''}" data-g="${g}">${g} gtt/mL</span>`).join("")}
      <span class="sp"></span>
      <button class="btn ghost" id="st">▶ 시작 ${esc(R.start_time)}</button><button class="btn ghost" id="en">■ 끝 ${esc(R.end_time)}</button></div>
    ${r.bags.filter(b=>!b.shot&&!b.removed).length>1 ? `<p class="small muted">수액 백이 ${r.bags.filter(b=>!b.shot&&!b.removed).length}개 — 분당 방울은 전체 총량·시간 기준입니다. 백마다 권장 시간(조제 칸)을 지키고, 번호 순서대로 따로 연결하세요.</p>`:""}`;
  $("#mins").onchange = e => { R.minutes = +e.target.value; refreshRecipe(); };
  document.querySelectorAll("[data-g]").forEach(x => x.onclick = () => { R.gtt = +x.dataset.g; refreshRecipe(); });
  $("#st").onclick = () => { R.start_time = hm(); refreshRecipe(); };
  $("#en").onclick = () => { R.end_time = hm(); refreshRecipe(); };
}
async function saveRun(){
  const R = S.run, r = R.last;
  if(r && r.stops.length && !R.doctor_ok) return toast("원장님 확인을 먼저 받아 주세요");
  if(!R.vitals.sbp) return toast("수축기 혈압을 넣어 주세요");
  const res = await api("POST", `/api/courses/${R.cid}/sessions`, {tier:R.tier, vitals:R.vitals, checks:R.checks, d:R.d,
    minutes:R.minutes, gtt_set:R.gtt, start_time:R.start_time, end_time:R.end_time,
    reactions:R.reactions.filter(x=>x!=="없음"), note:R.note, doctor_ok:R.doctor_ok});
  toast(res.n + "회차 저장");
  $("#save").disabled = true;
  $("#done").innerHTML = `<div class="alert info" style="margin-top:12px">저장 · ${res.next_due ? "다음 권장 <b>"+mdw(res.next_due)+"</b>" : "수액 회차 끝 → <b>"+esc(res.status)+"</b>"}</div>
    <div class="emr">${esc(res.emr)}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="cpe">EMR 복사</button>
      <button class="btn ghost" onclick="printHandout(${R.cid})">🖨 환자 안내문</button><span class="sp"></span>
      <button class="btn ghost" onclick="openPatient(${S.pid})">환자 화면으로</button></div>`;
  $("#cpe").onclick = async () => { try{ await navigator.clipboard.writeText(res.emr); toast("복사했습니다"); }catch(e){ toast("복사 안 됨"); } };
}

/* ───────── 환자 안내문 (성분명·약 이름 없이) ───────── */
async function printHandout(cid){
  const c = await api("GET", "/api/courses/"+cid), pr = P(c.program), plan = c.oral_plan || {with:[],after:[]};
  const w = window.open("", "_blank");
  const left = c.plan_dates.slice(c.done);
  w.document.write(`<!doctype html><meta charset="utf-8"><title>안내문</title>
   <style>body{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#16233F;max-width:680px;margin:24px auto;font-size:17px;line-height:1.6}
   h1{color:#195C3B;font-size:24px;margin:0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}
   .box{background:#F6F0E4;border-radius:12px;padding:12px 16px;margin:12px 0}</style>
   <h1>웰빙내과 · ${esc(S.patient ? S.patient.name : "")}님 ${esc(pr.name)} 관리 안내</h1>
   <div class="box">수액 <b>${c.done}/${c.total}회</b> 맞으셨습니다.
     ${left.length && c.status==="수액중" ? "<br>다음 권장일: <b>" + left.map(mdw).join(", ") + "</b>" : ""}</div>
   <h3>집에서 이렇게</h3><ul>${pr.aftercare.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
   ${(plan.with.length||plan.after.length) ? `<h3>보충제</h3><table><tr><th>이름</th><th>먹는 법</th><th>기간</th></tr>
     ${plan.with.concat(plan.after).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.dose)}</td><td>${r.weeks}주</td></tr>`).join("")}</table>` : ""}
   <p style="margin-top:20px">불편한 점이 있으면 언제든 연락 주세요. 웰빙내과의원 · 일산서구 중앙로 1426</p>
   <script>window.onload=()=>window.print()<\/script>`);
  w.document.close();
}

/* ───────── 프로그램표 (직원용·인쇄) ───────── */
function viewTable(el){
  const cat = S.cat;
  const mgNames = Object.values(cat.ingredients).filter(i=>(i.flags||[]).includes("mg")).map(i=>i.name).join("·") || "마그네슘";
  el.innerHTML = `<div class="row"><h1>프로그램표</h1><span class="sp"></span><button class="btn ghost noprint" onclick="print()">🖨 인쇄</button></div>
   <p class="muted noprint">웰빙내과 맞춤 수액 — 기본 = N/S 100 한 백에 삐콤 + 마그네슘(+ 처방별 약), 프리미엄 = 같은 N/S 백 + 써프라민 100 단독 한 백. 비치라이트가 있으면 비타민C는 N/S 100에 따로. 값·구성은 「설정」에서 바꿉니다. 번호가 다른 백은 순서대로 따로 연결합니다.</p>
   <div class="alert warn">※ 수축기혈압 ${cat.sbp_no_mg} 이하면 ${esc(mgNames)} 섞지 않기 (자동으로 빠짐)</div>
   <div class="withside"><div>` +
   cat.order.map(k => { const p = P(k), plan = oralPlan(k, k==="gut"?"D":null, []);
    return `<div class="card" style="border-left:8px solid ${p.color}">
     <div class="row"><span style="font-size:26px">${p.icon}</span><h2 style="margin:0">${esc(p.name)}</h2>
       <span class="muted">${esc(p.for)}</span><span class="sp"></span><b>${p.course_options.map(o=>esc(o.label)).join(" / ")}</b></div>
     <table class="matrix" style="margin-top:8px"><tr><th style="width:120px">등급</th><th>조제</th><th style="width:90px">시간</th><th style="width:150px">값</th></tr>
      ${TL(p).map(t => { const T = p.tiers[t], o = p.course_options[0];
        return `<tr><td><span class="pill tier-${t}">${TN(t)}</span><div class="small">${esc(T.point)}</div></td>
          <td>${recipeLines(T.bags)}<div class="small muted">${esc(T.from)}</div></td><td>${T.min}분</td>
          <td><b>${won(T.price)}</b>${o.total>1? `<div class="small">${o.total}회 ${won(pkgPrice(T.price,o.total,cat.package_discount))}</div>`:""}</td></tr>`; }).join("")}
     </table>
     <div class="small" style="margin-top:8px"><b>경구 이어가기</b>
       ${plan.with.length ? `<br>수액과 함께: ${plan.with.map(r=>esc(r.name)+" "+r.weeks+"주").join(" · ")}` : ""}
       ${plan.after.length ? `<br>수액 뒤 유지: ${plan.after.map(r=>esc(r.name)+" "+r.weeks+"주").join(" · ")}` : ""}
       ${k==="gut" ? `<br><span class="muted">유형별: 설사형 보울라디 / 변비형 비피더스+차전자피 / 혼합형 복합 유산균+차전자피 · 복통·팽만 → 페퍼민트 오일</span>`:""}</div>
     ${p.followup_weeks.length ? `<div class="small muted">증상 점수: ${esc(p.score.label)} — ${p.followup_weeks.map(w=>w+"주").join("·")}</div>`:""}
    </div>`; }).join("") +
   `<div class="card"><h2>성분 메모</h2><table class="matrix"><tr><th>원내 이름</th><th>성분</th><th>섞을 때</th></tr>` +
     Object.entries(cat.ingredients).map(([k,v]) => `<tr><td><b>${esc(v.name)}</b>${v.stock===false?' <span class="tag late">재고 확인</span>':""}${v.stock_note?` <span class="tag">${esc(v.stock_note)}</span>`:""}</td><td>${esc(v.generic)}</td><td class="small">${esc([v.mix,v.notice].filter(Boolean).join(" · "))}</td></tr>`).join("") +
   `</table></div></div>${sidePanel([])}</div>`;
}

/* ───────── 설정 ───────── */
function viewSettings(el){
  const cat = S.cat;
  const ingOpts = Object.entries(cat.ingredients).filter(([k,v])=>!v.base).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join("");
  const baseOpts = sel => Object.entries(cat.ingredients).filter(([k,v])=>v.base).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${esc(v.name)}</option>`).join("");
  const conf = cat.conflicts || [];
  const confOf = (pk,tk) => conf.filter(c=>c.program===pk && c.tier===tk);
  const groupOpts = [...new Set((cat.incompat||[]).flatMap(r=>[r.a,r.b]).filter(g=>g!=="*"))];
  el.innerHTML = `<div class="row"><h1>설정</h1><span class="sp"></span>
     <button class="btn ghost" id="reset">처음 값으로</button><button class="btn" id="saveSet">저장</button></div>
   ${conf.length ? `<div class="alert stop">🚫 같은 백 금지 조합 ${conf.length}곳 — 아래 빨간 표시를 다른 백으로 옮겨 주세요</div>` : `<div class="alert info">✅ 모든 등급이 「같이 섞으면 안 되는 조합」을 피했습니다</div>`}
   <div class="withside"><div>
   <div class="card"><div class="row"><b>회차권 할인</b><input type="number" id="disc" value="${cat.package_discount}" style="width:80px">%</div></div>` +
   cat.order.concat(cat.later||[]).map(k => { const p = P(k); return `<div class="card" style="border-left:8px solid ${p.color}"><h2>${p.icon} ${esc(p.name)}${p.ready===false?' <span class="tag">준비 중</span>':""}</h2>` +
     TL(p).map(t => { const T = p.tiers[t]; const cf = confOf(k,t); return `<div class="tierbox tier-${t}" style="margin-bottom:10px;cursor:default" data-p="${k}" data-tier="${t}">
       <div class="row"><b>${TN(t)}</b><span class="muted">1회</span><input type="number" data-f="price" value="${T.price}" style="width:120px">원
         <span class="muted">시간</span><input type="number" data-f="min" value="${T.min}" style="width:80px">분
         <span class="sp"></span><button class="btn sm ghost" data-addbag>＋ 백 추가</button></div>
       ${cf.map(c=>`<div class="alert stop small">🚫 ${c.bag}번 백: ${esc(c.a)} × ${esc(c.b)} → ${esc(c.do)}</div>`).join("")}
       ${T.bags.map((b,bi) => `<div class="bag" data-bag="${bi}" style="margin-top:8px"><div class="row"><span class="bagno">${bi+1}</span><select data-base>${baseOpts(b.base)}</select>
          ${b.add.map(([ik,q],ii)=>`<span class="chip" style="cursor:default">${esc(cat.ingredients[ik].name)} <input type="number" step="0.5" data-ing="${ik}" value="${q}" style="width:64px;padding:4px"> ${esc(cat.ingredients[ik].unit)}
             <span style="cursor:pointer;color:var(--red)" data-del>✕</span></span>`).join("")}
          <select data-addsel><option value="">＋ 넣기</option>${ingOpts}</select>
          ${T.bags.length>1?`<span class="sp"></span><button class="btn sm ghost" data-delbag>백 지우기</button>`:""}</div></div>`).join("")}
       </div>`; }).join("") + `</div>`; }).join("") +
   `<div class="card"><h2>원내 약 추가 (새로 들인 재고)</h2><div class="row">
      <input type="text" id="ni_name" placeholder="원내 이름" style="width:160px">
      <input type="text" id="ni_gen" placeholder="성분·함량" style="width:220px">
      <select id="ni_unit"><option>A</option><option>V</option><option>mL</option><option>병</option></select>
      <label class="chip"><input type="checkbox" id="ni_base"> 바탕액</label>
      <input type="number" id="ni_ml" placeholder="mL" style="width:90px" title="바탕액 용량 또는 1개당 늘어나는 양">
      <select id="ni_grp"><option value="">섞기 묶음 없음</option>${groupOpts.map(g=>`<option>${g}</option>`).join("")}</select>
      <button class="btn" id="ni_add">추가</button></div>
      <p class="small muted">섞기 묶음을 고르면 그 묶음의 「같이 섞으면 안 되는 조합」 규칙이 똑같이 적용됩니다.</p></div>
   <div class="card"><h2>보충제 값</h2><table><tr><th>보충제</th><th>먹는 법</th><th>1통 며칠</th><th>1통 값</th></tr>` +
     Object.entries(cat.supplements).map(([k,s]) => `<tr data-sup="${k}"><td><b>${esc(s.name)}</b></td><td><input type="text" data-sf="dose" value="${esc(s.dose)}" style="width:100%"></td>
       <td><input type="number" data-sf="days_per_pack" value="${s.days_per_pack}" style="width:80px"></td>
       <td><input type="number" data-sf="price" value="${s.price??""}" placeholder="입력" style="width:120px"></td></tr>`).join("") + `</table></div>
   </div>${sidePanel(conf.map(c=>c.rule))}</div>`;
  const collect = () => {
    const out = {programs:{}, supplements:{}, package_discount:+$("#disc").value};
    el.querySelectorAll("[data-tier]").forEach(box => {
      const pk = box.dataset.p, tk = box.dataset.tier;
      const bags = [...box.querySelectorAll("[data-bag]")].map(bg => ({base:$("[data-base]",bg).value,
        add:[...bg.querySelectorAll("[data-ing]")].map(i=>[i.dataset.ing, +i.value]).filter(x=>x[1]>0)}));
      out.programs[pk] = out.programs[pk] || {tiers:{}};
      out.programs[pk].tiers[tk] = {price:+$("[data-f=price]",box).value, min:+$("[data-f=min]",box).value, bags};
    });
    el.querySelectorAll("[data-sup]").forEach(tr => { const o = {};
      tr.querySelectorAll("[data-sf]").forEach(i => { const f=i.dataset.sf; o[f] = f==="dose" ? i.value : (i.value===""?null:+i.value); });
      out.supplements[tr.dataset.sup] = o; });
    return out;
  };
  // 화면에서 고친 값을 지우지 않고 다시 그리기
  const sync = () => { const o = collect(); for(const [pk,pv] of Object.entries(o.programs)) for(const [tk,tv] of Object.entries(pv.tiers)) Object.assign(S.cat.programs[pk].tiers[tk], tv); };
  const tierOf = x => { const box = x.closest("[data-tier]"); return S.cat.programs[box.dataset.p].tiers[box.dataset.tier]; };
  el.querySelectorAll("[data-del]").forEach(x => x.onclick = () => { x.closest(".chip").querySelector("[data-ing]").value = 0; sync(); viewSettings(el); });
  el.querySelectorAll("[data-addsel]").forEach(x => x.onchange = () => { if(!x.value) return; const v = x.value, bi = +x.closest("[data-bag]").dataset.bag;
    sync(); tierOf(x).bags[bi].add.push([v, 1]); viewSettings(el); toast("넣었습니다 — 저장을 눌러야 검사·반영됩니다"); });
  el.querySelectorAll("[data-addbag]").forEach(x => x.onclick = () => { sync(); const T = tierOf(x);
    const nb = Object.entries(S.cat.ingredients).find(([k,v])=>v.base && v.stock!==false); T.bags.push({base: nb ? nb[0] : T.bags[0].base, add:[]}); viewSettings(el); });
  el.querySelectorAll("[data-delbag]").forEach(x => x.onclick = () => { const bi = +x.closest("[data-bag]").dataset.bag; sync(); tierOf(x).bags.splice(bi,1); viewSettings(el); });
  $("#ni_add").onclick = async () => {
    const name = $("#ni_name").value.trim(); if(!name) return toast("이름을 넣어 주세요");
    const body = {ingredients:{["x_"+Date.now().toString(36)]:{name, generic:$("#ni_gen").value, unit:$("#ni_unit").value,
      base:$("#ni_base").checked, ml:+$("#ni_ml").value||0, add_ml:$("#ni_base").checked?0:(+$("#ni_ml").value||0),
      groups:$("#ni_grp").value?[$("#ni_grp").value]:[]}}};
    const o = collect(); Object.assign(body, o);
    S.cat = await api("PUT", "/api/catalog", body); toast("추가했습니다"); viewSettings(el); };
  $("#saveSet").onclick = async () => { S.cat = await api("PUT", "/api/catalog", collect());
    toast((S.cat.conflicts||[]).length ? "저장 — 같은 백 금지 조합이 남아 있습니다" : "저장했습니다"); viewSettings(el); };
  $("#reset").onclick = async () => { if(!confirm("설정을 모두 처음 값으로 되돌릴까요?")) return; S.cat = await api("PUT","/api/catalog",{reset:true}); viewSettings(el); };
}

/* ───────── 그리기 ───────── */
async function render(){
  const el = $("#main");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.go === S.view ||
    (b.dataset.go==="patients" && ["patient","new","run"].includes(S.view))));
  try{
    if(!S.cat) S.cat = await api("GET", "/api/catalog");
    if(S.view==="board") await viewBoard(el);
    else if(S.view==="patients") await viewPatients(el);
    else if(S.view==="patient") await viewPatient(el);
    else if(S.view==="new") viewNew(el);
    else if(S.view==="run") await viewRun(el);
    else if(S.view==="table") viewTable(el);
    else if(S.view==="settings") viewSettings(el);
  }catch(e){ console.error(e); el.innerHTML = `<div class="card alert stop">불러오지 못했습니다: ${esc(e.message)}</div>`; }
}
render();
</script>
